name: Offline downloader checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  downloader:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline regression in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/download-validation.ps1
      - name: Offline regression in PowerShell 7
        shell: pwsh
        run: ./tests/download-validation.ps1
